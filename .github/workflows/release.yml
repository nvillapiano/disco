name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Disco
        run: bash build.sh

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "${VERSION}" \
            --title "Disco ${VERSION}" \
            --notes "## Install

  1. Download **Disco.dmg** below
  2. Open the DMG and drag **Disco.app** to /Applications
  3. Launch Disco — right-click → Open on first run to bypass Gatekeeper
  4. Grant Accessibility in **System Settings → Privacy & Security → Accessibility**
  5. Type \`:fire\` in any app to get started 🪩" \
            Disco.dmg
